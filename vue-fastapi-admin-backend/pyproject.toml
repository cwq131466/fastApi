[project]
name = "vue-fastapi-admin"
version = "0.1.0"
description = "Vue FastAPI Admin - A modern admin management system"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "mizhexiaoxiao", email = "mizhexiaoxiao@gmail.com" },
]
keywords = [
    "fastapi",
    "vue",
    "admin",
    "rbac",
    "tortoise-orm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi==0.111.0",
    "starlette==0.37.2",
    "uvicorn==0.34.0",
    "pydantic==2.10.5",
    "pydantic-core==2.27.2",
    "pydantic-settings==2.7.1",
    "annotated-types==0.7.0",
    "tortoise-orm==0.23.0",
    "aiosqlite==0.20.0",
    "pypika-tortoise==0.3.2",
    "aerich==0.8.1",
    "PyJWT==2.10.1",
    "passlib==1.7.4",
    "argon2-cffi==23.1.0",
    "argon2-cffi-bindings==21.2.0",
    "email-validator==2.2.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "httpcore==1.0.7",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
    "loguru==0.7.3",
    "orjson==3.10.14",
    "ujson==5.10.0",
    "pytz==2024.2",
    "iso8601==2.1.0",
    "typing-extensions==4.12.2",
    "anyio==4.8.0",
    "sniffio==1.3.1",
    "uvloop==0.21.0 ; sys_platform != 'win32'",
    "httptools==0.6.4",
    "watchfiles==1.0.4",
    "websockets==14.1",
]

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "black==24.10.0",
    "isort==5.13.2",
    "ruff==0.9.1",
    "typer==0.15.1",
    "rich==13.9.4",
    "rich-toolkit==0.13.2",
    "fastapi-cli==0.0.7",
]
mysql = [
    "tortoise-orm[asyncmy]==0.23.0",
]
postgres = [
    "tortoise-orm[asyncpg]==0.23.0",
]
all = [
    "vue-fastapi-admin[dev,mysql,postgres]",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.black]
line-length = 120
target-version = [
    "py311",
    "py312",
]
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "F403",
    "F405",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
]

[tool.aerich]
tortoise_orm = "app.settings.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = [
    "app",
]
omit = [
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
